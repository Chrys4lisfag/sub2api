name: docker-publish

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*.*.*"]
  workflow_dispatch: {}
  workflow_run:
    workflows: ["sync-upstream"]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Build the binary on the runner instead of inside buildx. Local
      # buildx (Docker Desktop) embeds dist/ into the Go binary correctly;
      # GHA's buildx environment has been producing 86 MB binaries with
      # zero vendor-vue refs (frontend bytes silently dropped) even with
      # --no-cache. Bypassing buildx for the actual compile step works
      # around that without needing to root-cause the buildkit issue.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          echo "=== dist/ output ==="
          ls -la ../backend/internal/web/dist
          ls ../backend/internal/web/dist/assets | wc -l

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: backend/go.sum

      - name: Build backend binary (with embed)
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < ./cmd/server/VERSION)"
          DATE_VALUE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Force full rebuild — go-embed cache invalidation has been
          # observed to silently reuse an old empty-dist embed.
          go clean -cache
          go build \
            -a \
            -tags embed \
            -ldflags="-s -w -X main.Version=${VERSION_VALUE} -X main.Commit=${{ github.sha }} -X main.Date=${DATE_VALUE} -X main.BuildType=release" \
            -trimpath \
            -o ../sub2api \
            ./cmd/server
          echo "=== binary embed check ==="
          ls -la ../sub2api
          bin_size=$(stat -c '%s' ../sub2api)
          echo "binary size: $bin_size"
          vc=$(grep -c vendor-vue ../sub2api || echo 0)
          echo "vendor-vue refs: $vc"
          av=$(grep -c AccountsView ../sub2api || echo 0)
          echo "AccountsView refs: $av"
          if [ "$bin_size" -lt 88000000 ]; then echo "FATAL: binary too small ($bin_size < 88M)"; exit 1; fi
          if [ "$vc" -lt 50 ]; then echo "FATAL: vendor-vue refs too few ($vc < 50)"; exit 1; fi
          if [ "$av" -lt 5 ]; then echo "FATAL: AccountsView refs too few ($av < 5)"; exit 1; fi
          echo "✓ embed verified"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (package pre-built binary)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
          provenance: false
